[tool.poetry]
name = "agentskills-hub-api"
version = "0.1.0"
description = "Catalog, publishing, subscription, and authentication API for the Agent Skills Hub"
license = "MIT"
authors = ["Pratik Panda"]
readme = "README.md"
homepage = "https://github.com/pratikxpanda/agentskills-hub"
repository = "https://github.com/pratikxpanda/agentskills-hub"
packages = [{include = "agentskills_hub_api"}]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
agentskills-hub-core = ">=0.1.0,<1.0"
fastapi = ">=0.115,<1.0"
uvicorn = ">=0.30,<1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
