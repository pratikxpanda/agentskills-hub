[tool.poetry]
name = "agentskills-hub-core"
version = "0.1.0"
description = "Domain model, skill store, and repositories for the Agent Skills Hub"
license = "MIT"
authors = ["Pratik Panda"]
readme = "README.md"
homepage = "https://github.com/pratikxpanda/agentskills-hub"
repository = "https://github.com/pratikxpanda/agentskills-hub"
packages = [{include = "agentskills_hub_core"}]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
agentskills-core = ">=0.3.0,<0.4.0"
agentskills-fs = ">=0.3.0,<0.4.0"
sqlmodel = ">=0.0.22,<0.1.0"
alembic = ">=1.13,<2.0"
aiosqlite = ">=0.20,<1.0"
argon2-cffi = ">=23.1,<26.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
