[tool.poetry]
name = "agentskills-hub-core"
version = "0.1.0"
description = "Domain model, skill store, and repositories for the Agent Skills Hub"
license = "MIT"
authors = ["Pratik Panda"]
readme = "README.md"
homepage = "https://github.com/pratikxpanda/agentskills-hub"
repository = "https://github.com/pratikxpanda/agentskills-hub"
packages = [{include = "agentskills_hub_core"}]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
agentskills-core = ">=0.2.3,<0.3.0"
agentskills-fs = ">=0.2.3,<0.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
