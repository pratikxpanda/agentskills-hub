[tool.poetry]
name = "agentskills-hub-cli"
version = "0.1.0"
description = "Command-line client for the Agent Skills Hub"
license = "MIT"
authors = ["Pratik Panda"]
readme = "README.md"
homepage = "https://github.com/pratikxpanda/agentskills-hub"
repository = "https://github.com/pratikxpanda/agentskills-hub"
packages = [{include = "agentskills_hub_cli"}]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
