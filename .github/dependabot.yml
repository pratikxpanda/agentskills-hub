version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - ci
    commit-message:
      prefix: "ci:"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: "deps:"

  # The Dockerfile pins base images by digest, which is only safe if something is responsible for
  # moving the digest. That something is this.
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: "deps:"

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: "deps:"
