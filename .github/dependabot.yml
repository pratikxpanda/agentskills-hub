version: 2

# The npm ecosystem is added by the web/ scaffolding, not before it: Dependabot errors on every
# run against a directory with no manifest.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - ci
    commit-message:
      prefix: "ci:"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: "deps:"
