version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - ci
    commit-message:
      prefix: "ci:"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: "deps:"

  # The Dockerfile pins base images by digest, which is only safe if something is responsible for
  # moving the digest. That something is this.
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: "deps:"

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: "deps:"
    ignore:
      # TypeScript 7 is the Go port and drops the JavaScript compiler API that typescript-eslint
      # builds on, so `typescript-eslint` peer-caps at `<6.1.0` and throws on TS 7 even if the
      # install is forced. `npm ci` fails outright, which is what broke the container image build.
      # Lift this once typescript-eslint ships TS >=7.1 support:
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: typescript
        versions: [">=7"]
