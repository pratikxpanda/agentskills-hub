name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Surfaces an SDK release that breaks the example skills even when the repo is quiet.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Check relative links
        run: python scripts/check_links.py

      - name: Install PyYAML
        run: python -m pip install --upgrade pyyaml

      - name: Validate YAML
        run: python scripts/check_yaml.py

  examples:
    name: Example skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      # Installed unpinned on purpose: a published SDK that rejects our examples is a
      # finding, not a broken build to be papered over with a constraint.
      - name: Install the SDK
        run: python -m pip install --upgrade agentskills-core agentskills-fs

      - name: Validate example skills
        run: python scripts/validate_examples.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Check formatting
        run: poetry run ruff format --check packages/ scripts/

      - name: Lint
        run: poetry run ruff check packages/ scripts/

      - name: Type check
        run: poetry run mypy

      - name: Check import contracts
        run: poetry run lint-imports

      - name: Audit dependencies
        run: poetry run pip-audit

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run tests
        run: poetry run pytest packages/ -v

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      # Publish, subscribe, connect over MCP, assert the tool surface. No model is involved, so
      # this is slow but never flaky.
      - name: Run the end-to-end test
        run: poetry run pytest tests/ -v

  web:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # The build is also the typecheck: `npm run build` runs `tsc --noEmit` first, and it is
      # what injects the CSP, so a broken policy fails here rather than in production.
      - name: Build
        run: npm run build

      # What ships is the contents of web/dist, so this is the gate. A finding here means the UI
      # a user loads is vulnerable.
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high

      # The build toolchain is reported but does not block, because "there is no patched version
      # yet" is a real state and stopping every merge until upstream publishes one buys nothing.
      # GHSA-rgw5-rvv9-x895 (brace-expansion, via eslint) is the current example: published
      # 2026-08-03, patched in 5.0.9, and 5.0.8 is still the latest on npm.
      - name: Audit build dependencies
        continue-on-error: true
        run: npm audit --audit-level=high

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build
        run: docker buildx build --file deploy/Dockerfile --tag agentskills-hub:ci --load .

      # Building an image proves it compiles. Starting it proves the entrypoint, the migrations,
      # the seeder, the non-root user, and the read-only filesystem agree with each other, which
      # is where every one of this item's acceptance criteria actually lives.
      - name: Start it the way compose does
        run: |
          docker volume create hub-ci-data
          docker run --detach --name hub \
            --publish 8000:8000 \
            --read-only --tmpfs /tmp \
            --user 10001:10001 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --volume hub-ci-data:/data \
            --env HUB_SEED=on \
            --env HUB_ALLOWED_HOSTS=127.0.0.1:8000,localhost:8000 \
            agentskills-hub:ci
          for _ in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "The Hub never became healthy."
          docker logs hub
          exit 1

      - name: The seeder printed a key and an MCP endpoint
        run: |
          docker logs hub 2>&1 | tee /tmp/hub.log
          grep -q "MCP endpoint  http" /tmp/hub.log
          key=$(grep -oE "ashub_\S+" /tmp/hub.log | head -n 1)
          test -n "$key"
          echo "::add-mask::$key"
          echo "HUB_KEY=$key" >> "$GITHUB_ENV"

      - name: The UI is served from the same origin
        run: curl --silent --fail http://127.0.0.1:8000/ | grep -q "<title>"

      # The volume, not the container, is what has to survive, and "health is 200" would not have
      # noticed an empty store. The key minted before the restart still working, against a catalog
      # that still has the seeded skill in it, is the claim worth making.
      - name: The data survives a restart
        run: |
          docker rm --force hub
          docker run --detach --name hub2 \
            --publish 8001:8000 \
            --read-only --tmpfs /tmp \
            --user 10001:10001 \
            --volume hub-ci-data:/data \
            --env HUB_ALLOWED_HOSTS=127.0.0.1:8001,localhost:8001 \
            agentskills-hub:ci
          for _ in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:8001/api/health > /dev/null && break
            sleep 2
          done
          curl --silent --fail --header "Authorization: Bearer $HUB_KEY" \
            http://127.0.0.1:8001/api/skills | tee /tmp/catalog.json
          grep -q "incident-response" /tmp/catalog.json

      - name: Generate an SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: agentskills-hub:ci
          format: spdx-json
          artifact-name: agentskills-hub.spdx.json
          output-file: agentskills-hub.spdx.json

      - name: Publish the SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: agentskills-hub.spdx.json
