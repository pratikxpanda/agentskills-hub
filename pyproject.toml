[tool.poetry]
name = "agentskills-hub"
version = "0.1.0"
description = "Governed catalogue and delivery plane for Agent Skills (https://agentskills.io)"
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
# The Hub cannot support a Python the SDK does not. Since SDK v0.3 that is no longer a cap.
python = ">=3.12,<4.0"
agentskills-hub-core = { path = "packages/core/agentskills-hub-core", develop = true }
agentskills-hub-api = { path = "packages/api/agentskills-hub-api", develop = true }
agentskills-hub-gateway = { path = "packages/gateway/agentskills-hub-gateway", develop = true }
agentskills-hub-cli = { path = "packages/cli/agentskills-hub-cli", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3"
pytest-asyncio = ">=0.24"
pytest-cov = ">=5.0"
httpx = ">=0.27"
ruff = ">=0.4"
mypy = ">=1.11"
pip-audit = ">=2.7"
import-linter = ">=2.0"
pyyaml = ">=6.0,<7.0"
types-pyyaml = ">=6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["packages"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = [
    "agentskills_hub_core",
    "agentskills_hub_api",
    "agentskills_hub_gateway",
    "agentskills_hub_cli",
]

[tool.mypy]
python_version = "3.12"
files = ["packages", "scripts", "conftest.py"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
disallow_untyped_defs = true

# core is the layer that has to survive the API being replaced, so it is held to a higher standard.
[[tool.mypy.overrides]]
module = "agentskills_hub_core.*"
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_any_generics = true
check_untyped_defs = true
warn_return_any = true
strict_equality = true

[tool.importlinter]
root_packages = [
    "agentskills_hub_core",
    "agentskills_hub_api",
    "agentskills_hub_gateway",
    "agentskills_hub_cli",
]
# Required because the contracts below forbid third-party modules, not just our own.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core does not depend on a web framework"
type = "forbidden"
source_modules = ["agentskills_hub_core"]
forbidden_modules = ["fastapi", "starlette", "uvicorn"]

[[tool.importlinter.contracts]]
name = "core does not depend on the layers above it"
type = "forbidden"
source_modules = ["agentskills_hub_core"]
forbidden_modules = [
    "agentskills_hub_api",
    "agentskills_hub_gateway",
    "agentskills_hub_cli",
]

[[tool.importlinter.contracts]]
name = "api does not depend on the gateway or the CLI"
type = "forbidden"
source_modules = ["agentskills_hub_api"]
forbidden_modules = ["agentskills_hub_gateway", "agentskills_hub_cli"]

[[tool.importlinter.contracts]]
name = "gateway does not depend on the api or the CLI"
type = "forbidden"
source_modules = ["agentskills_hub_gateway"]
forbidden_modules = ["agentskills_hub_api", "agentskills_hub_cli"]

# Content access goes through the SkillStore protocol, which is what makes a blob-backed
# store a configuration change rather than a rewrite.
[[tool.importlinter.contracts]]
name = "only core touches the filesystem"
type = "forbidden"
source_modules = ["agentskills_hub_api", "agentskills_hub_gateway"]
forbidden_modules = ["pathlib", "shutil", "tempfile"]
# Direct imports only: these layers reach the filesystem *through* core, which necessarily
# imports pathlib. The rule is that they never do it themselves.
allow_indirect_imports = true

# Persistence lives behind repositories, which is what makes the PostgreSQL move tractable.
[[tool.importlinter.contracts]]
name = "no ORM session escapes core"
type = "forbidden"
source_modules = ["agentskills_hub_api", "agentskills_hub_gateway", "agentskills_hub_cli"]
forbidden_modules = ["sqlalchemy", "sqlmodel", "alembic"]
allow_indirect_imports = true

# Item 8's acceptance criterion, made mechanical: the Hub defines no MCP tool and no skill
# provider. Reaching `mcp` directly is what writing one would require, so forbidding the import
# is what stops the SDK being reimplemented here one convenience at a time.
[[tool.importlinter.contracts]]
name = "MCP is used only through the SDK server"
type = "forbidden"
source_modules = [
    "agentskills_hub_core",
    "agentskills_hub_api",
    "agentskills_hub_gateway",
    "agentskills_hub_cli",
]
forbidden_modules = ["mcp"]
allow_indirect_imports = true
